lockfileVersion: '6.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@scope/pkg':
        specifier: ^2.0.0
        version: 2.0.0
      chalk:
        specifier: ^5.3.0
        version: 5.3.0
      foo:
        specifier: github:example/foo
        version: github.com/example/foo/0123456789abcdef
      lodash:
        specifier: ^4.17.21
        version: 4.17.21
      my-workspace-pkg:
        specifier: workspace:*
        version: link:packages/my-workspace-pkg
      react-dom:
        specifier: ^18.2.0
        version: 18.2.0(react@18.2.0)
      string-width-cjs:
        specifier: npm:string-width@^4.2.0
        version: /string-width@4.2.3

packages:

  /@scope/pkg@2.0.0:
    resolution: {integrity: sha512-x}
    dev: false

  /chalk@4.1.2:
    resolution: {integrity: sha512-x}
    engines: {node: '>=10'}
    dev: false

  /chalk@5.3.0:
    resolution: {integrity: sha512-x}
    dev: false

  /lodash@4.17.21:
    resolution: {integrity: sha512-x}
    dev: false

  /react-dom@18.2.0(react@18.2.0):
    resolution: {integrity: sha512-x}
    peerDependencies:
      react: ^18.2.0
    dependencies:
      react: 18.2.0
    dev: false

  /react@18.2.0:
    resolution: {integrity: sha512-x}
    dev: false

  /string-width@4.2.3:
    resolution: {integrity: sha512-x}
    dev: false

  github.com/example/foo/0123456789abcdef:
    resolution: {tarball: https://codeload.github.com/example/foo/tar.gz/0123456789abcdef}
    name: foo
    version: 1.0.0
    dependencies:
      chalk: 4.1.2
    dev: false
