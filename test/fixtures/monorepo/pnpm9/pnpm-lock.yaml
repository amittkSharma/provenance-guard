lockfileVersion: '9.0'

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.6.3
        version: 5.6.3

  apps/web:
    dependencies:
      chalk:
        specifier: ^4.1.2
        version: 4.1.2
      ui:
        specifier: workspace:*
        version: link:../../packages/ui

  packages/ui:
    dependencies:
      chalk:
        specifier: ^5.3.0
        version: 5.3.0
      debug:
        specifier: ^4.4.1
        version: 4.4.1

packages:

  chalk@4.1.2:
    resolution: {integrity: sha512-x}

  chalk@5.3.0:
    resolution: {integrity: sha512-x}

  debug@4.4.1:
    resolution: {integrity: sha512-x}

  ms@2.1.3:
    resolution: {integrity: sha512-x}

  typescript@5.6.3:
    resolution: {integrity: sha512-x}
    hasBin: true

snapshots:

  chalk@4.1.2: {}

  chalk@5.3.0: {}

  debug@4.4.1:
    dependencies:
      ms: 2.1.3

  ms@2.1.3: {}

  typescript@5.6.3: {}
