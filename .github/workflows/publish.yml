name: Publish

# Publishes with npm trusted publishing (OIDC): no npm token is stored, and npm attaches provenance automatically.
# One-time setup on npmjs.com: package settings → Trusted publishing → GitHub Actions, workflow file `publish.yml`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Release tag must match package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json ($expected)" >&2
            exit 1
          fi
      - run: npm publish
